[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-trader"
version = "0.1.0"
description = "Forecast-driven trading bot for Kalshi temperature markets: scenario-ensemble forecasting core, fair-probability pricing, edge grader, paper executor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ben.melson" }]
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    # ZoneInfo needs the IANA tz database; bundled on Linux but not always on
    # minimal containers / Windows, so we depend on it explicitly.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
weather-trader = "weather_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
