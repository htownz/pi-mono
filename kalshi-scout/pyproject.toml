[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-scout"
version = "0.3.0"
description = "Kalshi temperature-market intelligence scanner: settlement-aware contract state, NWS station truth, opportunity ranker."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ben.melson" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "click>=8.1",
    "python-dateutil>=2.9",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
kalshi-scout = "kalshi_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
